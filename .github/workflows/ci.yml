name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check src/ tests/ scripts/
      - name: Format check
        run: ruff format --check src/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[rich,dev]"
      - name: Smoke test - import
        run: python -c "from llm_comply import ComplianceConfig, TestRunner, SpecLoader; print('import ok')"
      - name: Smoke test - CLI help
        run: llm-comply --help
      - name: Smoke test - CLI version
        run: llm-comply --version
      - name: Smoke test - list tests
        run: |
          llm-comply --list
          llm-comply --format openai_responses --list
          llm-comply --format chat_completions --list
          llm-comply --format messages --list
          llm-comply --format google_generate --list
          llm-comply --format open-responses --list  # legacy alias
          llm-comply --format openai-responses --list  # legacy alias
          llm-comply --format openai-chat --list  # legacy alias
          llm-comply --format anthropic --list  # legacy alias
          llm-comply --format google-genai --list  # legacy alias
          llm-comply --format google-interactions --list  # legacy alias
      - name: Verify bundled specs
        run: make verify
      - name: Unit tests
        run: make test-unit
