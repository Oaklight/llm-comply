name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check src/
      - name: Format check
        run: ruff format --check src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[rich,dev]"
      - name: Smoke test - import
        run: python -c "from llm_comply import ComplianceConfig, TestRunner, SpecLoader; print('import ok')"
      - name: Smoke test - CLI help
        run: llm-comply --help
      - name: Smoke test - CLI version
        run: llm-comply --version
      - name: Smoke test - list tests
        run: |
          llm-comply --list
          llm-comply --format chat_completions --list
          llm-comply --format messages --list
          llm-comply --format google_generate --list
          llm-comply --format openai-chat --list  # legacy alias
      - name: Spec manifest check
        run: llm-comply specs --check
      - name: Schema validation unit test
        run: |
          python -c "
          from llm_comply.schema import SpecLoader; import pathlib
          specs_dir = pathlib.Path('src/llm_comply/specs')
          spec = SpecLoader(str(specs_dir / 'openresponses.json'))
          assert spec.spec_version == '2026-04-24'
          errors = spec.validate({'id': 'resp_1', 'object': 'response'}, 'ResponseResource')
          assert len(errors) > 0, 'incomplete response should have errors'
          print(f'Open Responses: {len(spec.schema_names)} schemas, validation works')
          spec2 = SpecLoader(str(specs_dir / 'openai_chat.json'))
          assert len(spec2.schema_names) > 2000, 'bundled OpenAI Chat spec is stale'
          assert 'CreateChatCompletionResponse' in spec2.schema_names
          assert 'CreateChatCompletionStreamResponse' in spec2.schema_names
          assert spec2.validate('none', 'ReasoningEffort') == []
          assert spec2.validate('xhigh', 'ReasoningEffort') == []
          stream = {'id': 'chatcmpl-1', 'object': 'chat.completion.chunk', 'created': 1, 'model': 'm', 'choices': [{'index': 0, 'delta': {'content': 'hi'}, 'finish_reason': None, 'logprobs': None}]}
          assert spec2.validate(stream, 'CreateChatCompletionStreamResponse') == []
          print(f'OpenAI Chat: {len(spec2.schema_names)} schemas, current enums and stream schema work')
          spec3 = SpecLoader(str(specs_dir / 'anthropic.json'))
          assert 'Message' in spec3.schema_names
          print(f'Anthropic: {len(spec3.schema_names)} schemas')
          spec4 = SpecLoader(None)
          assert len(spec4.schema_names) == 0
          print('Google: no-spec mode works')
          print('All schema tests passed')
          "
