<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>llm-comply — LLM API Compliance Tester</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8f9fb; --bg-card: #fff; --border: #e5e7eb; --text: #1a1a2e;
  --text-dim: #6b7280; --accent: #111827; --accent-hover: #374151;
  --green: #16a34a; --green-bg: #dcfce7; --green-border: #bbf7d0;
  --red: #dc2626; --red-bg: #fef2f2; --red-border: #fecaca;
  --blue: #2563eb; --blue-bg: #eff6ff; --blue-border: #bfdbfe;
  --yellow: #d97706; --yellow-bg: #fffbeb; --yellow-border: #fde68a;
  --radius: 8px;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.6; }
a { color: var(--blue); text-decoration: none; }

.container { max-width: 1080px; margin: 0 auto; padding: 48px 24px; }
.header { margin-bottom: 32px; }
.header h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.02em; }
.header p { color: var(--text-dim); margin-top: 6px; font-size: 0.95rem; }
.content { display: grid; grid-template-columns: 340px 1fr; gap: 28px; align-items: start; }
@media (max-width: 768px) { .content { grid-template-columns: 1fr; } }

/* Config */
.config { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; position: sticky; top: 24px; }
.config h2 { font-size: 1rem; font-weight: 600; margin-bottom: 16px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
.field input, .field select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; font-family: var(--font); background: var(--bg-card); color: var(--text); outline: none; transition: border-color 0.15s; }
.field input:focus, .field select:focus { border-color: var(--blue); }
.field-row { display: flex; gap: 10px; align-items: center; }
.field-row label { margin-bottom: 0; font-size: 0.82rem; text-transform: none; letter-spacing: 0; }
.field-row input[type="checkbox"] { width: auto; }
.adv-toggle { font-size: 0.82rem; color: var(--text-dim); cursor: pointer; user-select: none; margin-bottom: 10px; }
.adv-toggle:hover { color: var(--text); }
.adv { display: none; }
.adv.open { display: block; }
.btn-row { display: flex; gap: 8px; }
.btn-run { flex: 1; padding: 10px 24px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: background 0.15s; font-family: var(--font); }
.btn-run:hover { background: var(--accent-hover); }
.btn-run:disabled { background: var(--border); cursor: not-allowed; }
.btn-run.stopping { background: var(--red); }
.btn-run.stopping:hover { background: #b91c1c; }
.btn-clear { padding: 10px 14px; background: transparent; color: var(--text-dim); border: 1px solid var(--border); border-radius: 6px; font-size: 0.82rem; cursor: pointer; font-family: var(--font); }
.btn-clear:hover { background: var(--red-bg); color: var(--red); border-color: var(--red-border); }

/* Suite */
.suite h2 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
.suite .meta { color: var(--text-dim); font-size: 0.82rem; margin-bottom: 14px; }

/* Summary */
.summary { padding: 10px 16px; border-radius: var(--radius); font-weight: 500; font-size: 0.9rem; text-align: center; margin-bottom: 14px; display: none; }
.summary.pass { display: block; background: var(--green-bg); color: #166534; border: 1px solid var(--green-border); }
.summary.fail { display: block; background: var(--red-bg); color: #991b1b; border: 1px solid var(--red-border); }
.summary.warn { display: block; background: var(--yellow-bg); color: #92400e; border: 1px solid var(--yellow-border); }
.summary.running { display: block; background: var(--blue-bg); color: #1e40af; border: 1px solid var(--blue-border); }

/* Test cards */
.test-list { display: flex; flex-direction: column; gap: 8px; }
.test-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color 0.15s; }
.test-card.pass { border-color: var(--green-border); }
.test-card.warn { border-color: var(--yellow-border); }
.test-card.fail { border-color: var(--red-border); }
.test-head { display: grid; grid-template-columns: 24px 1fr auto auto; align-items: start; gap: 12px; padding: 13px 16px; cursor: pointer; transition: background 0.1s; }
.test-head:hover { background: #f9fafb; }
.test-icon { font-size: 1rem; text-align: center; margin-top: 1px; }
.test-icon.pass { color: var(--green); }
.test-icon.warn { color: var(--yellow); }
.test-icon.fail { color: var(--red); }
.test-icon.skip { color: var(--yellow); }
.test-icon.pending { color: #ccc; }
.test-icon.running { color: var(--blue); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.test-info { min-width: 0; }
.test-name { font-weight: 500; font-size: 0.9rem; }
.test-desc { color: var(--text-dim); font-size: 0.78rem; margin-top: 1px; }
.test-time { color: var(--text-dim); font-size: 0.78rem; margin-top: 2px; white-space: nowrap; }
.test-arrow { color: var(--text-dim); font-size: 0.8rem; margin-top: 2px; transition: transform 0.15s; }
.test-card.expanded .test-arrow { transform: rotate(180deg); }
.tag { display: inline-block; font-size: 0.65rem; font-weight: 500; padding: 1px 6px; border-radius: 3px; vertical-align: middle; margin-left: 5px; }
.tag-stream { background: #e0f2fe; color: #0284c7; }

/* Expandable detail */
.test-detail { display: none; padding: 0 16px 14px; font-size: 0.82rem; }
.test-card.expanded .test-detail { display: block; }
.section { margin-bottom: 10px; }
.section-label { font-weight: 600; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
.test-detail pre { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; font-size: 0.72rem; overflow-x: auto; max-height: 200px; white-space: pre-wrap; word-break: break-all; margin: 0; }
.err-box { background: var(--red-bg); border: 1px solid var(--red-border); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
.err-label { font-weight: 600; color: var(--red); font-size: 0.75rem; margin-bottom: 4px; }
.err-list { padding-left: 16px; color: #991b1b; margin: 0 0 8px; }
.err-list li { margin-bottom: 2px; font-size: 0.78rem; }
.warn-box { background: var(--yellow-bg); border: 1px solid var(--yellow-border); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
.warn-label { font-weight: 600; color: var(--yellow); font-size: 0.75rem; margin-bottom: 4px; }
.warn-list { padding-left: 16px; color: #92400e; margin: 0 0 8px; }
.warn-list li { margin-bottom: 2px; font-size: 0.78rem; }
.pass-msg { color: var(--green); }

.footer { text-align: center; color: var(--text-dim); font-size: 0.78rem; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>llm-comply</h1>
    <p>Test any API endpoint for compliance with OpenAI Chat, Open Responses, Anthropic, or Google GenAI specifications.</p>
  </div>
  <div class="content">
    <div class="config">
      <h2>Configuration</h2>
      <div class="field">
        <label>API Format</label>
        <select id="fmt" onchange="onFormatChange()">
          <option value="open-responses">Open Responses</option>
          <option value="openai-chat">OpenAI Chat Completions</option>
          <option value="anthropic">Anthropic Messages</option>
          <option value="google-genai">Google GenAI</option>
        </select>
      </div>
      <div class="field">
        <label>Base URL</label>
        <input id="url" type="text" placeholder="https://api.openai.com/v1">
      </div>
      <div class="field">
        <label>Model</label>
        <input id="model" type="text" placeholder="gpt-4o-mini">
      </div>
      <div class="field">
        <label>API Key</label>
        <input id="key" type="password" placeholder="sk-...">
      </div>
      <div class="adv-toggle" onclick="toggleAdv()">▸ Advanced</div>
      <div class="adv" id="adv">
        <div class="field">
          <label>Auth Header</label>
          <input id="auth-header" type="text" value="Authorization">
        </div>
        <div class="field field-row">
          <input type="checkbox" id="bearer" checked>
          <label for="bearer">Use "Bearer" prefix</label>
        </div>
        <div class="field">
          <label>Ignore Errors</label>
          <input id="ignore" type="text" placeholder="refusal,verbosity">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-run" id="run-btn" onclick="runTests()">Run Tests</button>
        <button class="btn-clear" onclick="clearCreds()" title="Clear API key and base URL">Clear</button>
      </div>
    </div>

    <div class="suite">
      <h2>Test Suite</h2>
      <div class="meta" id="suite-meta"></div>
      <div class="summary" id="summary"></div>
      <div class="test-list" id="tests"></div>
    </div>
  </div>
  <div class="footer">
    <a href="https://github.com/Oaklight/llm-comply" target="_blank">llm-comply</a> — Multi-format LLM API compliance testing
    <div style="margin-top:8px"><a href="https://hits.sh/llm-comply.service.oaklight.top/" target="_blank" rel="noopener"><img src="https://hits.sh/llm-comply.service.oaklight.top.svg?style=flat&label=visits&color=888" alt="visits" height="20" loading="lazy" referrerpolicy="no-referrer"></a></div>
  </div>
</div>

<script>
const DEFAULTS = {
  'open-responses': { url: 'https://api.openai.com/v1', model: 'gpt-4o-mini', auth: 'Authorization', bearer: true },
  'openai-chat': { url: 'https://api.openai.com/v1', model: 'gpt-4o-mini', auth: 'Authorization', bearer: true },
  'anthropic': { url: 'https://api.anthropic.com/v1', model: 'claude-haiku-4-5-20251001', auth: 'x-api-key', bearer: false },
  'google-genai': { url: 'https://generativelanguage.googleapis.com', model: 'gemini-2.5-flash', auth: 'x-goog-api-key', bearer: false },
};
const defaultUrls = new Set(Object.values(DEFAULTS).map(d => d.url));
const defaultModels = new Set(Object.values(DEFAULTS).map(d => d.model));
const defaultAuths = new Set(Object.values(DEFAULTS).map(d => d.auth));
let testData = [];
let abortCtrl = null;

function $(id) { return document.getElementById(id); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function onFormatChange() {
  stopTests();
  const fmt = $('fmt').value;
  const d = DEFAULTS[fmt] || {};
  if (!$('url').value || defaultUrls.has($('url').value)) $('url').value = d.url || '';
  if (!$('model').value || defaultModels.has($('model').value)) $('model').value = d.model || '';
  if (!$('auth-header').value || defaultAuths.has($('auth-header').value)) {
    $('auth-header').value = d.auth || 'Authorization';
    $('bearer').checked = d.bearer !== false;
  }
  $('run-btn').textContent = 'Run Tests';
  $('run-btn').classList.remove('stopping');
  loadTests();
}

function toggleAdv() {
  const adv = $('adv');
  const toggle = adv.previousElementSibling;
  adv.classList.toggle('open');
  toggle.textContent = adv.classList.contains('open') ? '▾ Advanced' : '▸ Advanced';
}

function clearCreds() {
  $('url').value = '';
  $('key').value = '';
  $('ignore').value = '';
  onFormatChange();
}

async function loadTests() {
  const fmt = $('fmt').value;
  try {
    const resp = await fetch('/api/tests?format=' + encodeURIComponent(fmt));
    testData = await resp.json();
  } catch(e) { testData = []; }
  renderTests();
}

function renderTests() {
  $('suite-meta').textContent = testData.length + ' tests';
  $('summary').className = 'summary';
  $('summary').textContent = '';
  $('tests').innerHTML = testData.map(t => `
    <div class="test-card" id="t-${t.id}">
      <div class="test-head" onclick="toggleCard('t-${t.id}')">
        <div class="test-icon pending">○</div>
        <div class="test-info">
          <div class="test-name">${esc(t.name)}${t.streaming ? '<span class="tag tag-stream">streaming</span>' : ''}</div>
          <div class="test-desc">${esc(t.description)}</div>
        </div>
        <div class="test-time"></div>
        <div class="test-arrow">▼</div>
      </div>
      <div class="test-detail"></div>
    </div>
  `).join('');
}

function toggleCard(id) { document.getElementById(id).classList.toggle('expanded'); }

function stopTests() {
  if (abortCtrl) { abortCtrl.abort(); abortCtrl = null; }
}

async function runTests() {
  if (abortCtrl) { stopTests(); return; }

  const btn = $('run-btn');
  abortCtrl = new AbortController();
  btn.textContent = 'Stop';
  btn.classList.add('stopping');
  renderTests();

  const payload = {
    format: $('fmt').value,
    base_url: $('url').value,
    api_key: $('key').value,
    model: $('model').value,
    auth_header: $('auth-header').value,
    use_bearer: $('bearer').checked,
    ignore: $('ignore').value,
  };

  let passed = 0, failed = 0, skipped = 0, warned = 0;

  for (const t of testData) {
    if (!abortCtrl || abortCtrl.signal.aborted) break;

    const card = document.getElementById('t-' + t.id);
    const icon = card.querySelector('.test-icon');
    icon.className = 'test-icon running';
    icon.textContent = '⟳';
    updateSummary(passed, failed, skipped, warned, testData.length, true);

    try {
      const resp = await fetch('/api/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...payload, test_id: t.id }),
        signal: abortCtrl.signal,
      });
      const r = await resp.json();
      applyResult(card, r);
      if (r.status === 'passed') {
        passed++;
        if (r.warnings && r.warnings.length) warned++;
      }
      else if (r.status === 'skipped') skipped++;
      else failed++;
    } catch(e) {
      if (e.name === 'AbortError') break;
      icon.className = 'test-icon fail';
      icon.textContent = '✗';
      failed++;
    }
  }

  const wasCancelled = abortCtrl && abortCtrl.signal.aborted;
  abortCtrl = null;
  updateSummary(passed, failed, skipped, warned, testData.length, false, wasCancelled);
  btn.textContent = 'Run Tests';
  btn.classList.remove('stopping');
}

function applyResult(card, r) {
  const icon = card.querySelector('.test-icon');
  const timeEl = card.querySelector('.test-time');
  const detail = card.querySelector('.test-detail');

  timeEl.textContent = r.duration_ms ? Math.round(r.duration_ms) + 'ms' : '';

  if (r.status === 'passed' && r.warnings && r.warnings.length) {
    icon.className = 'test-icon warn'; icon.textContent = '⚠';
    card.classList.add('warn');
    detail.innerHTML = buildWarningsHtml(r);
  } else if (r.status === 'passed') {
    icon.className = 'test-icon pass'; icon.textContent = '✓';
    card.classList.add('pass');
    detail.innerHTML = '<div class="section pass-msg">All validations passed</div>';
  } else if (r.status === 'skipped') {
    icon.className = 'test-icon skip'; icon.textContent = '⏭';
    detail.innerHTML = '<div class="section"><em>' + esc(r.errors?.[0] || 'Skipped') + '</em></div>';
  } else {
    icon.className = 'test-icon fail'; icon.textContent = '✗';
    card.classList.add('fail');
    detail.innerHTML = buildDetailHtml(r);
    card.classList.add('expanded');
  }
}

function _buildWarningSection(warnings) {
  if (!warnings || !warnings.length) return '';
  let html = '<div class="warn-box"><div class="warn-label">Warnings</div><ul class="warn-list">';
  const max = 8;
  warnings.slice(0, max).forEach(w => { html += '<li>' + esc(w) + '</li>'; });
  if (warnings.length > max) html += '<li>... and ' + (warnings.length - max) + ' more</li>';
  html += '</ul></div>';
  return html;
}

function buildWarningsHtml(r) {
  return '<div class="section pass-msg">Passed with warnings</div>' + _buildWarningSection(r.warnings);
}

function buildDetailHtml(r) {
  let html = '';
  if (r.errors && r.errors.length) {
    html += '<div class="err-box"><div class="err-label">Errors</div><ul class="err-list">';
    const max = 8;
    r.errors.slice(0, max).forEach(e => { html += '<li>' + esc(e) + '</li>'; });
    if (r.errors.length > max) html += '<li>... and ' + (r.errors.length - max) + ' more</li>';
    html += '</ul></div>';
  }
  html += _buildWarningSection(r.warnings);
  if (r.request) {
    let pretty = r.request;
    try { pretty = JSON.stringify(JSON.parse(r.request), null, 2); } catch(e) {}
    html += '<div class="section"><div class="section-label">Request</div><pre>' + esc(pretty) + '</pre></div>';
  }
  if (r.response) {
    let pretty = r.response;
    try { pretty = JSON.stringify(JSON.parse(r.response), null, 2); } catch(e) {}
    html += '<div class="section"><div class="section-label">Response</div><pre>' + esc(pretty) + '</pre></div>';
  }
  return html;
}

function updateSummary(passed, failed, skipped, warned, total, running, cancelled) {
  const el = $('summary');
  const done = passed + failed + skipped;
  const warnSuffix = warned ? ' (' + warned + ' with warnings)' : '';
  if (running) {
    el.className = 'summary running';
    el.textContent = 'Running... ' + done + '/' + total;
  } else if (cancelled) {
    el.className = 'summary fail';
    el.textContent = 'Stopped — ' + passed + ' passed, ' + failed + ' failed (' + done + '/' + total + ' run)';
  } else if (failed === 0 && warned > 0) {
    el.className = 'summary warn';
    el.textContent = 'All ' + passed + ' tests passed' + warnSuffix;
  } else if (failed === 0) {
    el.className = 'summary pass';
    el.textContent = 'All ' + passed + ' tests passed!';
  } else {
    el.className = 'summary fail';
    el.textContent = passed + '/' + total + ' passed, ' + failed + ' failed' + (skipped ? ', ' + skipped + ' skipped' : '') + warnSuffix;
  }
}

onFormatChange();
</script>
</body>
</html>
